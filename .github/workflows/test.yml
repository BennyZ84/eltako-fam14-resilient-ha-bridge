name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover tests -v
      - run: python tools/sanitize_check.py
      - run: python tools/generate_usb300_devices.py examples/device-map.example.csv > /tmp/generated.devices
